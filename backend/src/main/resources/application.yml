spring:
  application:
    name: codementor-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codementor}
    username: ${DATABASE_USER:codementor}
    password: ${DATABASE_PASSWORD:codementor_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  jwt:
    secret: ${JWT_SECRET:VGhpcy1sb2NhbC1kZXZlbG9wbWVudC1qd3Qta2V5LTI1Ni1iaXRzIQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
